<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breathe has moved</title>
  <meta http-equiv="refresh" content="0; url=https://davecube123.github.io/breath/">
  <link rel="canonical" href="https://davecube123.github.io/breath/">
  <style>body{font:17px -apple-system,system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#000;color:#f5f5f7;text-align:center}a{color:#40c8e0}</style>
</head>
<body>
  <p>Breathe has its own home now.<br><a href="https://davecube123.github.io/breath/">Open Breathe</a></p>
  <script>
    // Retire the old service worker that lived here, then go to the new address.
    (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
      .then((regs) => Promise.all(regs.filter((r) => r.scope.endsWith('/breathe/')).map((r) => r.unregister())))
      .finally(() => location.replace('https://davecube123.github.io/breath/'));
  </script>
</body>
</html>
